name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  ci:
    uses: luxass/shared-workflows/.github/workflows/reusable-ci.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    permissions:
      contents: read
    with:
      node-version: "24"
      fmt: true
      fmt-script: "fmt:check"

  test:
    needs: ci
    uses: luxass/shared-workflows/.github/workflows/reusable-test.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    permissions:
      contents: read
    with:
      node-version: "24"
      pre-test-script: "build"
