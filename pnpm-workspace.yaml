ignoreScripts: true
minimumReleaseAge: 7200
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Remove after 2026-11-27 03:05 UTC, when the suite fixture fix is five days old.
  - vitest-testdirs@4.5.3
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
catalogMode: prefer

catalogs:
  dev:
    oxfmt: 0.79.0
    oxlint: 1.94.0
    publint: 0.3.25
    tsdown: 0.23.7
    typescript: 7.0.2

  test:
    testcontainers: 12.2.1
    vitest: 5.1.1
    vitest-testdirs: 4.5.3

  types:
    "@types/node": 24.19.2
